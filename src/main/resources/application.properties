spring.application.name=TaskManagement

# JWT (use a long random secret in production; this demo value is for local development only)
app.security.jwt.secret=ChangeThisToAVeryLongSecretKeyForHS256AlgorithmMinimum256BitsRecommendedForProductionUse1234567890
app.security.jwt.expiration-ms=86400000

# Demo user (override in production)
app.security.demo-user.username=demo
app.security.demo-user.password=demo123

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging (SLF4J)
logging.level.root=INFO
logging.level.com.example.TaskManagement=INFO
